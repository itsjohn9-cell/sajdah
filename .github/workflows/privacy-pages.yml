name: Publish privacy policy

on:
  push:
    branches: [main]
    paths:
      - web/privacy.html
      - .github/workflows/privacy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare policy-only site
        run: |
          mkdir policy-site
          cp web/privacy.html policy-site/index.html
          cp web/privacy.html policy-site/privacy.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: policy-site
      - name: Deploy policy
        id: deployment
        uses: actions/deploy-pages@v4

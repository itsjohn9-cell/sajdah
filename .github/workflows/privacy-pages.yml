name: Publish Sajdah web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sajdah-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate app and camera
        run: |
          npm ci
          npm run lint
          npm test
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test
      - name: Download and verify bundled pose model
        run: |
          curl --fail --location \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            --output web/vendor/mediapipe/pose_landmarker_lite.task
          echo '59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a  web/vendor/mediapipe/pose_landmarker_lite.task' | sha256sum --check
      - uses: actions/configure-pages@v5
      - name: Build complete web app
        run: |
          flutter build web --base-href /sajdah/
          test -f build/web/rakat/sensors.mjs
          test -f build/web/vendor/mediapipe/pose_landmarker_lite.task
          test -f build/web/privacy.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy web app and policy
        id: deployment
        uses: actions/deploy-pages@v4

name: sijda
description: "Sijda: an offline-first companion for worship and remembrance."
publish_to: 'none'
version: 0.1.6+7

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/beep.wav
    - web/rakat/
    - web/vendor/mediapipe/
    - web/vendor/mediapipe/wasm/
